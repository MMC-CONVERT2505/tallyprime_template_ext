# Default (`docker compose up`): Postgres + Redis only — the fast path for local dev,
# where the app itself runs natively via `npm run start:dev` for hot-reload.
#
# `docker compose --profile full up`: also builds and runs the app in a container,
# same image this project ships to production (see Dockerfile, docs/deployment-plan.md).
# Useful for testing the containerized build locally before it goes to staging.
#
# NOTE: TallyPrime is intentionally NOT here. Tally is a Windows desktop app that
# must run natively on the client machine to expose localhost:9000 — it is never
# containerized. Point TALLY_HOST/TALLY_PORT at wherever Tally is running (from
# inside the `app` container on Windows/Mac, that's usually host.docker.internal).
services:
  postgres:
    image: postgres:16-alpine
    container_name: tally_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tally}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tally}
      POSTGRES_DB: ${DB_NAME:-tally_migration}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - tally_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-tally} -d ${DB_NAME:-tally_migration}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tally_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - tally_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tally_app
    profiles: ['full']
    restart: unless-stopped
    env_file: .env
    environment:
      # Override the host-oriented values .env carries for local tooling — inside
      # the compose network, Postgres/Redis are reachable by service name, not
      # 127.0.0.1. DATABASE_URL must be overridden too, since configuration.ts
      # prefers it over DB_HOST when both are set.
      DB_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${DB_USER:-tally}:${DB_PASSWORD:-tally}@postgres:5432/${DB_NAME:-tally_migration}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations are NOT run here — the runtime image is pruned of devDependencies
    # (no `prisma` CLI), and docs/deployment-plan.md deliberately treats migration as
    # its own deploy step, not something bundled into container start. Run it from
    # the host first: `npx prisma migrate deploy` (DATABASE_URL / DB_* already point
    # at 127.0.0.1:5432, which this compose file publishes postgres to).

volumes:
  tally_pgdata:
  tally_redisdata:
